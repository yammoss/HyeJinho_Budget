  --good:#6FC79C; --bad:#FF8177; --inc:#D9B877; --exp:#E0A090; --sav:#8FB2D6;
  --shadow:0 0 0 1px rgba(255,255,255,.02); --head:#2B2622; --head-ink:#EFE7DF;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--ground);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.45;
  background-image:radial-gradient(900px 400px at 85% -120px,rgba(217,169,156,.22),transparent 70%),radial-gradient(700px 360px at 0% -100px,rgba(183,205,191,.22),transparent 70%);background-repeat:no-repeat}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:1360px;margin:0 auto;padding:18px 16px 60px;display:flex;flex-direction:column;gap:14px}
.num{font-variant-numeric:tabular-nums}

/* header */
.top{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:flex-end;justify-content:space-between}
.brand h1{margin:0;font-size:26px;font-weight:700;letter-spacing:-.02em;display:inline-block}
.brand h1::after{content:"";display:block;height:3px;border-radius:2px;margin-top:6px;background:var(--brand)}
.brand .sub{margin:6px 0 0;color:var(--dim);font-size:12px}
.ctrl{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px;box-shadow:var(--shadow)}
.seg button{border:0;background:transparent;padding:6px 11px;border-radius:7px;cursor:pointer;color:var(--ink-2);font-weight:600;font-size:13px}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.seg button:disabled{opacity:.35;cursor:default}
.icon{border:1px solid var(--line);background:var(--surface);border-radius:10px;width:36px;height:36px;cursor:pointer;box-shadow:var(--shadow);font-size:15px}
.months{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none}
.months::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 13px;cursor:pointer;font-weight:600;font-size:13px;color:var(--ink-2);transition:.15s}
.chip:hover{border-color:var(--rose)}
.chip.on{background:var(--head);color:var(--head-ink);border-color:var(--head)}
.chip:disabled{opacity:.35;cursor:default}

/* sticky top block */
.stick{position:static;border-bottom:1px solid var(--line);margin:-18px -16px 0;padding:16px 16px 10px;display:flex;flex-direction:column;gap:10px;
  background:color-mix(in srgb,var(--ground) 90%,transparent)}
.stick.compact{border-bottom-color:var(--line);box-shadow:0 6px 18px rgba(59,53,48,.08);padding-top:8px;padding-bottom:8px;gap:6px}
.stick.compact .brand .sub,.stick.compact .brand h1::after{display:none}
.stick.compact .brand h1{font-size:19px}
.stick.compact .months{padding-bottom:2px}.stick.compact .chip{padding:4px 11px;font-size:12px}
.stick.compact .g5{display:flex;overflow-x:auto;gap:8px;scrollbar-width:none}.stick.compact .g5::-webkit-scrollbar{display:none}
.stick.compact .kpi{flex:1 0 128px;padding:7px 11px 6px}
.stick.compact .kpi .v{font-size:16px;margin:1px 0 0}.stick.compact .kpi .v small{font-size:11px}
.stick.compact .kpi .lb span:last-child,.stick.compact .kpi svg.spark,.stick.compact .kpi .dl,.stick.compact .kpi .cmp{display:none}
.stick.compact .g5>.kpi:last-child{grid-column:auto}
/* phone: only the month row stays fixed */
@media (max-width:820px){
  .stick{position:static;display:contents;margin:0;padding:0;border:0;background:none;-webkit-backdrop-filter:none;backdrop-filter:none}
  .months{position:sticky;top:0;z-index:20;margin:0 -16px;padding:8px 16px;background:color-mix(in srgb,var(--ground) 92%,transparent);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
}
/* cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:16px 18px;min-width:0}
.card h2{margin:0 0 12px;font-size:14px;font-weight:700;display:flex;align-items:center;gap:8px;letter-spacing:-.01em}
.card h2 small{font-weight:500;color:var(--dim);font-size:12px}
.grid{display:grid;gap:14px}
.g5{grid-template-columns:repeat(5,minmax(0,1fr))}
.g21{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g21>.card,.g2>.card{align-self:start}
@media (max-width:1100px){.g5{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:820px){.g21,.g2{grid-template-columns:minmax(0,1fr)}.g5{grid-template-columns:repeat(2,minmax(0,1fr))}.g5>.kpi:last-child{grid-column:span 2}.kpi svg.spark{height:26px}.kpi .cmp{display:none}.kpi .v{font-size:20px}}

.kpi{position:relative;overflow:hidden;padding:14px 16px 10px}
.kpi .lb{font-size:12px;font-weight:600;color:var(--ink-2);display:flex;justify-content:space-between;align-items:center}
.kpi .v{font-size:23px;font-weight:700;letter-spacing:-.02em;margin:6px 0 2px;white-space:nowrap}
.kpi .v small{font-size:13px;font-weight:600;color:var(--dim);margin-left:2px}
.kpi .dls{display:flex;gap:5px;flex-wrap:wrap;position:relative;z-index:1}
.kpi .dl{font-size:11.5px;font-weight:600;display:inline-flex;gap:4px;align-items:center;padding:2px 7px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.kpi .dl.good{background:rgba(62,142,107,.12);color:var(--good)}
.kpi .dl.bad{background:rgba(184,57,47,.10);color:var(--bad)}
.kpi svg.spark{display:block;width:100%;height:30px;margin-top:8px;opacity:.95}
.kpi .dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.hero{background:linear-gradient(135deg,#FCF3DD,#F7E6C4);border-color:#EBD7AA}
:root[data-theme="dark"] .hero{background:linear-gradient(135deg,#4B3E2B,#3D3323);border-color:#5A4A30}

/* charts */
.plot svg{display:block;width:100%;height:auto;overflow:visible}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--ink-2);margin-bottom:6px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.axis text{fill:var(--dim);font-size:10.5px}
.mbar{transform-box:fill-box;transform-origin:bottom;animation:rise .7s cubic-bezier(.2,.8,.2,1) both;cursor:pointer;transition:opacity .15s}
.mcol:hover .mbar{opacity:.8}
@keyframes rise{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@media (prefers-reduced-motion:reduce){.mbar{animation:none}*{transition:none!important}}
.donutwrap{display:flex;gap:16px;align-items:center;flex-wrap:wrap;justify-content:center}
.donut{position:relative;width:190px;height:190px;flex:0 0 auto}
.donut svg{width:100%;height:100%;transform:rotate(-90deg)}
.donut circle{fill:none;stroke-width:26;transition:stroke-width .15s,opacity .15s;cursor:pointer}
.donut .ctr{position:absolute;inset:0;display:grid;place-content:center;text-align:center;pointer-events:none}
.donut .ctr b{font-size:19px;letter-spacing:-.02em}.donut .ctr span{font-size:11.5px;color:var(--dim)}
.dleg{flex:1 1 170px;display:flex;flex-direction:column;gap:5px;min-width:170px}
.dleg button{display:grid;grid-template-columns:10px 1fr auto;gap:8px;align-items:center;border:0;background:none;padding:3px 6px;border-radius:8px;cursor:pointer;text-align:left;font-size:12.5px}
.dleg button:hover,.dleg button.on{background:var(--accent-soft)}
.dleg i{width:10px;height:10px;border-radius:3px}
.dleg em{font-style:normal;color:var(--dim);font-size:11.5px;margin-left:6px}

.pills{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.pill{border:1px solid var(--line);background:transparent;border-radius:999px;padding:4px 11px;font-size:12.5px;cursor:pointer;color:var(--ink-2);font-weight:600}
.pill.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.hb{display:grid;grid-template-columns:minmax(80px,150px) 1fr auto;gap:10px;align-items:center;padding:6px 0;font-size:13px}
.hb .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hb .bar{height:12px;border-radius:7px;background:var(--line);overflow:hidden;position:relative}
.hb .bar i{display:block;height:100%;border-radius:7px;transform-origin:left;animation:grow .8s cubic-bezier(.2,.8,.2,1) both}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.hb .amt{text-align:right;font-weight:600;white-space:nowrap}.hb .amt small{color:var(--dim);font-weight:500;margin-left:6px}
.hb.over .bar i{background:var(--bad)!important}.hb.over .amt{color:var(--bad)}
.mhb{cursor:pointer;border-radius:8px}.mhb:hover{background:var(--accent-soft)}.mhb.open{background:var(--accent-soft)}
.mdet{padding:2px 0 8px 4px;margin-bottom:2px;border-bottom:1px dashed var(--line)}
.mrow{display:grid;grid-template-columns:40px 1fr auto;gap:8px;font-size:12px;color:var(--ink-2);padding:3px 2px}
.mrow .d{color:var(--dim)}.mrow .amt{font-weight:600;color:var(--ink)}
.bud .track{position:relative}
.bud .mark{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);opacity:.35;border-radius:1px}

/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal .wd{font-size:11px;color:var(--dim);text-align:center;font-weight:600}
.cal .cell{aspect-ratio:1/0.95;border-radius:9px;border:1px solid var(--line);padding:3px 5px;display:flex;flex-direction:column;justify-content:space-between;cursor:pointer;font-size:10.5px;position:relative;overflow:hidden}
.cal .cell.empty{border:0;cursor:default}
.cal .cell b{font-size:11px;color:var(--ink-2)}
.cal .cell span{font-weight:700;font-size:11px;text-align:right}
.cal .cell.sel{outline:2px solid var(--accent)}
.cal .cell .h{position:absolute;inset:0;background:var(--rose);border-radius:8px;z-index:0}
.cal .cell>*{position:relative;z-index:1}
.cal .cell.fxnote,.fxline{cursor:help}
.cal .cell.fxnote{border:1px dashed var(--line-strong);background:#ECEAE7;cursor:default;justify-content:center;gap:2px;text-align:center}
:root[data-theme="dark"] .cal .cell.fxnote{background:#302B27}
.cal .cell.fxnote b{font-size:10.5px;color:var(--ink-2)}.cal .cell.fxnote span{font-size:11.5px;font-weight:700;color:var(--ink-2);text-align:center}.cal .cell.fxnote small{font-size:10px;color:var(--dim)}
.fxline{margin-top:10px;font-weight:700;color:var(--ink-2);font-size:13px;display:inline-block;padding:6px 12px;border-radius:9px;background:#ECEAE7}
:root[data-theme="dark"] .fxline{background:#302B27}.fxline small{font-weight:500;color:var(--dim)}
.mx{display:grid;grid-template-columns:34px repeat(31,1fr);gap:3px;font-size:10px}
.mx .r{color:var(--dim);display:flex;align-items:center}
.mx .c{aspect-ratio:1;border-radius:3px;background:var(--line);cursor:pointer}
.mx .c.sel{outline:2px solid var(--accent)}
.mx .c.na{background:transparent;cursor:default}

/* tables */
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.tools input,.tools select{border:1px solid var(--line-strong);background:var(--surface);border-radius:9px;padding:7px 10px;font-size:13px}
.tools input{flex:1 1 180px;min-width:0}
table.tx{width:100%;border-collapse:collapse;font-size:13px}
table.tx th{font-size:11.5px;color:var(--dim);font-weight:600;text-align:left;padding:6px 8px;border-bottom:1px solid var(--line-strong)}
table.tx td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
table.tx td.a{text-align:right;font-weight:700;white-space:nowrap}
table.tx td.d{color:var(--dim);white-space:nowrap}
table.tx .tag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-weight:600;white-space:nowrap}
.inc-amt{color:var(--good)} .sav-amt{color:var(--sav)}
@media (max-width:640px){table.tx .hide-s{display:none}}
.more{margin-top:10px;width:100%;border:1px dashed var(--line-strong);background:transparent;border-radius:10px;padding:9px;cursor:pointer;color:var(--ink-2);font-weight:600}
.yt{width:100%;border-collapse:collapse;font-size:13px}
.yt th{font-size:11.5px;color:var(--dim);font-weight:600;padding:6px 8px;text-align:right;border-bottom:1px solid var(--line-strong)}
.yt th:first-child,.yt td:first-child{text-align:left}
.yt td{padding:9px 8px;text-align:right;border-bottom:1px solid var(--line)}
.yt tr.cur td{background:var(--accent-soft);font-weight:700}
.yt tr{cursor:pointer}.yt tr:hover td{background:var(--accent-soft)}
.insights{display:flex;gap:8px;flex-wrap:wrap}
.ins{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-size:12.5px;color:var(--ink-2);box-shadow:var(--shadow)}
.ins b{color:var(--ink)}
#tip{position:fixed;z-index:50;pointer-events:none;background:var(--head);color:var(--head-ink);padding:7px 10px;border-radius:9px;font-size:12px;line-height:1.35;box-shadow:0 6px 20px rgba(0,0,0,.25);opacity:0;transition:opacity .1s;max-width:340px}
.empty{color:var(--dim);text-align:center;padding:26px 0;font-size:13px}
footer{color:var(--dim);font-size:11.5px;text-align:center;margin-top:8px}


/* insight tab */
.vwrap{display:flex;flex-direction:column;gap:14px}
:root[data-view="ins"] #vDash,:root[data-view="ins"] #months,:root[data-view="ins"] #kpis,:root[data-view="ins"] #years{display:none}
:root:not([data-view="ins"]) #vIns{display:none}
.isum{font-size:15px;line-height:1.6;color:var(--ink-2)} .isum b{color:var(--ink)}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:1100px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:900px){.g3{grid-template-columns:minmax(0,1fr)}}
.g3>.card{align-self:start}
.ist .lb{font-size:12px;font-weight:600;color:var(--ink-2)}.ist .v{font-size:22px;font-weight:700;margin:5px 0 4px;letter-spacing:-.02em}.ist .v small{font-size:12px;color:var(--dim);margin-left:2px}
.ist .dls{display:flex;gap:5px;flex-wrap:wrap}
.ist .dl{font-size:11.5px;font-weight:600;display:inline-flex;gap:4px;padding:2px 7px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.ist .dl.good{background:rgba(62,142,107,.12);color:var(--good)}.ist .dl.bad{background:rgba(184,57,47,.10);color:var(--bad)}
.ihd{display:flex;align-items:center;gap:8px;margin:0 0 6px;font-size:15px;font-weight:700}
.ihd i{width:10px;height:10px;border-radius:50%}
.it{padding:10px 0 10px 12px;border-top:1px solid var(--line);position:relative}
.ihd+.it{border-top:0}
.it::before{content:"";position:absolute;left:0;top:12px;bottom:12px;width:3px;border-radius:2px;background:var(--tone)}
.it b{display:block;font-size:13.5px;margin-bottom:2px}.it span{font-size:12.5px;color:var(--ink-2);line-height:1.5;display:block}
.it.good{--tone:var(--good)}.it.warn{--tone:var(--bad)}.it.info{--tone:var(--sky)}
.ihd.good i{background:var(--good)}.ihd.warn i{background:var(--bad)}.ihd.info i{background:var(--sky)}
.dv{display:grid;grid-template-columns:minmax(70px,110px) 1fr auto;gap:8px;align-items:center;padding:5px 0;font-size:12.5px}
.dv .tr{height:12px;position:relative;background:var(--line);border-radius:6px}
.dv .tr i{position:absolute;top:0;bottom:0;border-radius:6px}
.dv .amt{text-align:right;font-weight:600;white-space:nowrap}
.inote{font-size:11.5px;color:var(--dim)}

/* lock */
.lock{min-height:100%;display:grid;place-items:center;padding:12vh 16px 24px}
.lockcard{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:28px 26px;display:flex;flex-direction:column;gap:14px}
.lockcard h1{margin:0;font-size:22px;font-weight:700}
.lockcard h1::after{content:"";display:block;height:3px;border-radius:2px;margin-top:8px;background:var(--brand)}
.lockcard p{margin:0;font-size:13px;color:var(--ink-2)}
.lockcard label.field{display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:600;color:var(--ink-2)}
.lockcard input[type=password]{border:1px solid var(--line-strong);border-radius:10px;padding:10px 12px;background:var(--surface);font-size:15px}
.lockcard .row{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink-2)}
.lockcard button{border:0;border-radius:10px;padding:11px 14px;background:var(--accent);color:var(--accent-ink);font-weight:700;cursor:pointer}
.lockcard button:disabled{opacity:.6;cursor:wait}
.lockcard .err{color:var(--bad);font-size:12.5px;font-weight:600;min-height:1em}
</style>

<div class="lock" id="lock" hidden>
  <form class="lockcard" id="lockform" autocomplete="off">
    <h1>혜지노 가계부</h1>
    <p>공유받은 비밀번호를 입력하면 열립니다.</p>
    <label class="field" for="pw">비밀번호<input id="pw" type="password" required autofocus></label>
    <label class="row" for="remember"><input id="remember" type="checkbox"> 이 기기에서 기억하기</label>
    <button type="submit" id="unlock">열기</button>
    <p class="err" id="lockerr" role="alert"></p>
  </form>
</div>

<div class="app" id="app" hidden>
  <div class="stick" id="stick">
  <header class="top">
    <div class="brand">
      <h1>혜지노 가계부</h1>

      <div class="seg" id="tabs"><button data-v="dash" class="on">대시보드</button><button data-v="ins">인사이트</button></div>

    </div>
  </header>
  <div class="months" id="months"></div>
  <section class="grid g5" id="kpis"></section>
  </div>
  <div class="vwrap" id="vDash">
  <div class="insights" id="insights"></div>

  <section class="grid g21">
    <div class="card"><h2>월별 수입 · 지출 <small id="ymsub"></small></h2>
      <div class="legend"><span><i style="background:var(--inc)"></i>수입</span><span><i style="background:var(--exp)"></i>지출</span><span><i style="background:var(--sav)"></i>저축</span></div>
      <div class="plot" id="monthly"></div></div>
    <div class="card"><h2>지출 구성 <small id="dsub"></small></h2><div id="donut"></div></div>
  </section>

  <section class="grid g2">
    <div class="card"><h2>세부 항목 <small>메모 기준</small></h2><div class="pills" id="memoPills"></div><div id="memoBars"></div></div>
    <div class="card"><h2>예산 대비 <small id="budsub"></small></h2><div id="budget"></div></div>
  </section>

  <section class="grid g21">
    <div class="card"><h2 id="calT">일별 지출</h2><div id="cal"></div></div>
    <div class="card"><h2>결제수단별 <small>지출</small></h2><div id="pay"></div><h2 style="margin-top:18px">자주 쓴 곳 TOP 8 <small>고정비 제외</small></h2><div id="top"></div></div>
  </section>

  <section class="grid g21">
    <div class="card"><h2>카테고리 추이 <small>누르면 선택 · 다시 누르면 해제 (선택 없으면 전체)</small></h2><div class="legend" id="stkLeg"></div><div class="plot" id="stack"></div></div>
    <div class="card"><h2>저축 현황 <small>현재 잔액</small></h2><div id="sav"></div></div>
  </section>

  <section class="card"><h2>연도별 비교 <small>행을 누르면 그 해로 이동</small></h2><div style="overflow-x:auto"><table class="yt" id="yt"></table></div></section>

  <section class="card"><h2 id="txT">거래 내역</h2>
    <div class="tools"><input id="q" type="search" placeholder="내용·메모·카테고리 검색"><select id="fc"></select><select id="ft"><option value="">전체</option><option value="1">지출</option><option value="0">수입</option><option value="2">저축</option></select></div>

    <section class="card"><h2>한눈에 보기 <small>최근 완결된 12개월 · ${W.lab(e - 11)} ~ ${W.lab(e)} · 직전 12개월과 비교</small></h2>
      <div class="isum">최근 12개월 동안 수입 <b>${fk(cur.inc)}</b>, 지출 <b>${fk(cur.exp)}</b>, 저축 <b>${fk(cur.sav)}</b> (저축률 <b>${rt.toFixed(1)}%</b>)이고, 매달 평균 <b>${fk(left / 12)}</b>이 통장에 남았어요. 아래는 가계부 데이터를 규칙으로 읽어낸 자동 분석이에요. 좋은 점 <b>${good.length}</b>개, 신경 쓸 점 <b>${warn.length}</b>개.</div></section>
    <section class="grid g4">
      ${stat("수입", fk(cur.inc), "", delta(cur.inc, prv.inc, true, "직전"))}
      ${stat("지출", fk(cur.exp), `고정비 ${fk(cur.fx)} · 여행/특별 ${fk(cur.lump)}`, delta(cur.exp, prv.exp, false, "직전"))}
      ${stat("저축률", rt.toFixed(1) + "<small>%</small>", `저축 ${fk(cur.sav)}`, delta(cur.rate, prv.rate, true, "직전"))}
      ${stat("월평균 남은 금액", fk(left / 12), "수입 − 지출 − 저축", `<span class="dl">직전 ${fk(pleft / 12)}</span>`)}
    </section>
    <section class="grid g3">${list(good, "good", "잘하고 있어요")}${list(warn, "warn", "신경 쓰면 좋아요")}${list(info, "info", "알아두면 좋아요")}</section>
    <section class="grid g21">
      <div class="card"><h2>월별 남은 금액 <small>수입 − 지출 − 저축 · 빨간색은 적자</small></h2><div class="plot"><svg viewBox="0 0 ${bw} ${bh}" class="axis">${nb}</svg></div></div>
      <div class="card"><h2>요일별 하루 평균 지출 <small>고정비·여행 제외</small></h2>${wdHtml}</div>
    </section>
    <section class="card"><h2>카테고리 증감 <small>최근 12개월 − 직전 12개월 (여행·특별지출 제외)</small></h2>${dvHtml}</section>
    <div class="inote" style="text-align:center">진행 중인 달은 데이터가 덜 쌓여 분석에서 제외했어요. 자동 규칙 기반이라 참고용으로 봐주세요.</div>`;
}

/* ---------- events ---------- */
function setYear(y){ S.y = y; S.day = null; const has = monthsWithData(y); if (S.m && !has.has(S.m)) S.m = 0; S.limit = 40; render(); }
document.addEventListener("click", e => {
  const t = e.target;
  let el;
  if ((el = t.closest("#tabs button"))) { S.v = el.dataset.v; scrollTo(0, 0); return render(); }
  if ((el = t.closest("#years button"))) return setYear(+el.dataset.y);
  if ((el = t.closest("#months .chip"))) { S.m = +el.dataset.m; S.day = null; S.limit = 40; return render(); }
  if ((el = t.closest("#yt tr[data-y]"))) return setYear(+el.dataset.y);
  if ((el = t.closest(".mcol"))) { S.m = S.m === +el.dataset.m ? 0 : +el.dataset.m; S.day = null; return render(); }
  if ((el = t.closest("[data-ci]"))) { S.cat = D.C[+el.dataset.ci].n; S.memoOpen = null; return renderDonut(), renderMemo(); }
  if ((el = t.closest("#memoPills .pill"))) { S.cat = el.dataset.cat; S.memoOpen = null; return renderDonut(), renderMemo(); }
  if ((el = t.closest("#memoBars .mhb"))) { const k = memoArr[+el.dataset.mi][0]; S.memoOpen = S.memoOpen === k ? null : k; return renderMemo(); }
  if ((el = t.closest("[data-st]"))) { const ci = +el.dataset.st; selCats.has(ci) ? selCats.delete(ci) : selCats.add(ci); return renderStack(); }
  if ((el = t.closest("[data-day]"))) {
    if (el.dataset.gm) { S.m = +el.dataset.gm; S.day = +el.dataset.day; } else S.day = S.day === +el.dataset.day ? null : +el.dataset.day;
    S.limit = 40; return render();
  }
  if (t.closest("#more")) { S.limit += 60; return renderTx(); }
  if (t.closest("#theme")) { const d = document.documentElement, n = d.dataset.theme === "dark" ? "light" : "dark"; d.dataset.theme = n; try { localStorage.setItem("hjn:theme", n); } catch (x) {} $("#theme").textContent = n === "dark" ? "☀" : "☾"; renderMonthly(); }
});
$("#q").addEventListener("input", e => { S.q = e.target.value; S.limit = 40; renderTx(); });
$("#fc").addEventListener("change", e => { S.fc = e.target.value; S.limit = 40; renderTx(); });
$("#ft").addEventListener("change", e => { S.ft = e.target.value; S.limit = 40; renderTx(); });

/* ---------- boot ---------- */

function countUp(){
  if (matchMedia("(prefers-reduced-motion:reduce)").matches) return;
  document.querySelectorAll(".kpi .v[data-k=won]").forEach(el => {
    const to = +el.dataset.v, t0 = performance.now(), dur = 700;
    (function f(t){ const p = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - p, 3); el.innerHTML = fmt(to * e) + "<small>원</small>"; if (p < 1) requestAnimationFrame(f); })(t0);
  });
}
function loadFonts(){
  const list = (PAYLOAD && PAYLOAD.fonts) || [];
  if (!list.length || !window.FontFace) return Promise.resolve();
  return Promise.all(list.map(f => new FontFace("Daemyung", `url(data:font/woff;base64,${f.data})`, {weight: String(f.weight)}).load().then(ff => document.fonts.add(ff)).catch(() => {})));
}
function startApp(){
  prep(PAYLOAD);
  let th = null; try { th = localStorage.getItem("hjn:theme"); } catch (e) {}
  if (!th) th = matchMedia("(prefers-color-scheme:dark)").matches ? "dark" : "light";
  document.documentElement.dataset.theme = th; $("#theme").textContent = th === "dark" ? "☀" : "☾";
  $("#lock").hidden = true; $("#app").hidden = false;
  const ly = D.last ? D.last.y : D.years[D.years.length - 1];
  S.y = ly; S.m = D.last ? D.last.m : 0;
  render(); countUp();
}
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function decryptPayload(pw){
  const te = new TextEncoder();
  const base = await crypto.subtle.importKey("raw", te.encode(pw), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({name: "PBKDF2", salt: b64(ENC.salt), iterations: ENC.iter, hash: "SHA-256"}, base, {name: "AES-GCM", length: 256}, false, ["decrypt"]);
  const buf = await crypto.subtle.decrypt({name: "AES-GCM", iv: b64(ENC.iv)}, key, b64(ENC.data));
  return JSON.parse(new TextDecoder().decode(buf));
}
async function tryUnlock(pw, remember){
  PAYLOAD = await decryptPayload(pw);
  try { remember ? localStorage.setItem("hjn:pw", pw) : localStorage.removeItem("hjn:pw"); } catch (e) {}
  loadFonts().then(startApp, startApp);
}
(function boot(){
  if (PAYLOAD) { loadFonts().then(startApp, startApp); return; }
  const lock = $("#lock"), err = $("#lockerr"), btn = $("#unlock");
  lock.hidden = false;
  if (!ENC) { err.textContent = "데이터가 없습니다."; btn.disabled = true; return; }
  if (!window.crypto || !crypto.subtle) { err.textContent = "이 브라우저에서는 열 수 없습니다. Chrome·Edge·Safari 최신 버전으로 열어주세요."; btn.disabled = true; return; }
  let saved = null; try { saved = localStorage.getItem("hjn:pw"); } catch (e) {}
  if (saved) { $("#remember").checked = true; tryUnlock(saved, true).catch(() => { try { localStorage.removeItem("hjn:pw"); } catch (e) {} }); }
  $("#pw").addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); $("#lockform").requestSubmit(); } });
  $("#lockform").addEventListener("submit", async e => {
    e.preventDefault(); err.textContent = ""; btn.disabled = true; btn.textContent = "여는 중…";
    try { await tryUnlock($("#pw").value, $("#remember").checked); }
    catch (ex) { err.textContent = "비밀번호가 맞지 않습니다. 다시 입력해 주세요."; $("#pw").select(); }
    finally { btn.disabled = false; btn.textContent = "열기"; }
  });
})();
</script>
